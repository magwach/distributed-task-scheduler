name: CD

on:
  push:
    branches: ["master"]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: backend/go.sum

      - name: Run backend tests
        working-directory: backend
        run: go test ./...
        env:
          JWT_SECRET: test_secret_for_ci
          REDIS_ADDR: localhost:6379

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/task-scheduler-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/scheduler/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/task-scheduler-scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/worker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/task-scheduler-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./docker/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/task-scheduler-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy API
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_API_ID_API }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Deploy Scheduler
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_API_ID_SCHEDULER }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Deploy Worker
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_API_ID_WORKER }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Deploy Frontend
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_API_ID_FRONTEND }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}'

      - name: Deployment complete
        run: echo "All services deployed to Render successfully."
