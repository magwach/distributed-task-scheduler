services:
  # ─── Infrastructure ──────────────────────────

  postgres:
    image: postgres:16
    container_name: task-scheduler-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_scheduler
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task-scheduler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend Services ────────────────────────

  api:
    build:
      context: ./backend
      dockerfile: ../docker/api/Dockerfile
    container_name: task-scheduler-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_Yg98UqsLPyKA@ep-winter-morning-ang9zh94-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      REDIS_ADDR: rediss://default:gQAAAAAAASy1AAIncDI3ZjkzZGM0ZjE1ZDE0ODMxOWVlMTc2MTcyMGQyNjFlN3AyNzY5ODE@fine-elk-76981.upstash.io:6379
      APP_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL}
      ENVIRONMENT: ${ENVIRONMENT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: ../docker/scheduler/Dockerfile
    container_name: task-scheduler-scheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_Yg98UqsLPyKA@ep-winter-morning-ang9zh94-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      REDIS_ADDR: rediss://default:gQAAAAAAASy1AAIncDI3ZjkzZGM0ZjE1ZDE0ODMxOWVlMTc2MTcyMGQyNjFlN3AyNzY5ODE@fine-elk-76981.upstash.io:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_Yg98UqsLPyKA@ep-winter-morning-ang9zh94-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      REDIS_ADDR: rediss://default:gQAAAAAAASy1AAIncDI3ZjkzZGM0ZjE1ZDE0ODMxOWVlMTc2MTcyMGQyNjFlN3AyNzY5ODE@fine-elk-76981.upstash.io:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://task.api.magwach.site/api/v1
        NEXT_PUBLIC_WEB_SOCKET_URL: task.api.magwach.site
    container_name: task-scheduler-frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

# ─── Volumes ─────────────────────────────────

volumes:
  postgres_data:
